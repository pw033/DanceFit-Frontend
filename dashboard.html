<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DanceFit Studio | Admin Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #080808;
            color: white;
            padding: 30px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 35px;
        }

        h2 span {
            color: #ff004f;
        }

        button {
            padding: 11px 20px;
            border: none;
            border-radius: 6px;
            background: #ff004f;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .stats {
            display: inline-block;
            background: #181818;
            border: 1px solid #333;
            padding: 25px;
            border-radius: 12px;
            width: 220px;
            margin: 0 15px 30px 0;
        }

        .stats h3 {
            color: #aaa;
            margin-bottom: 12px;
        }

        .stats h1 {
            color: #ff004f;
            font-size: 35px;
        }

        .table-container {
            background: #181818;
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
        }

        h3 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1250px;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #333;
            font-size: 14px;
            white-space: nowrap;
        }

        th {
            color: #ff004f;
        }

        #message {
            color: #aaa;
            margin: 15px 0;
        }

        #searchInput {
            width: 100%;
            max-width: 400px;
            padding: 12px;
            margin: 20px 0;
            background: #262626;
            color: white;
            border: 1px solid #444;
            border-radius: 7px;
            outline: none;
        }

        #searchInput:focus {
            border-color: #ff004f;
        }

        .filters {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .filters select {
            padding: 12px;
            background: #262626;
            color: white;
            border: 1px solid #444;
            border-radius: 7px;
            min-width: 200px;
        }

        .paid {
            color: #00d084;
            font-weight: bold;
        }

        .unpaid {
            color: #ff5252;
            font-weight: bold;
        }

        @media(max-width: 600px) {
            body {
                padding: 15px;
            }

            header {
                align-items: flex-start;
            }

            .stats {
                width: 100%;
                margin-right: 0;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>DanceFit <span>Studio</span></h2>
        <button onclick="logout()">Logout</button>
    </header>

    <div class="stats">
        <h3>Total Registrations</h3>
        <h1 id="totalCount">0</h1>
    </div>

    <div class="stats">
        <h3>Total Revenue</h3>
        <h1 id="totalRevenue">₹0</h1>
    </div>

    <div class="table-container">

        <h3>Student Registrations</h3>

        <button onclick="loadRegistrations()">Refresh Data</button>

        <input
            type="text"
            id="searchInput"
            placeholder="Search by student name or phone..."
        >

        <div class="filters">

            <select id="courseFilter">
                <option value="">All Courses</option>
                <option value="Zumba">Zumba</option>
                <option value="Zumba Dance">Zumba Dance</option>
                <option value="Power Yoga">Power Yoga</option>
                <option value="Aerobics">Aerobics</option>
                <option value="Stretching">Stretching</option>
                <option value="Bollywood Dance">Bollywood Dance</option>
            </select>

            <select id="planFilter">
                <option value="">All Membership Plans</option>
                <option value="Basic Plan">Basic Plan</option>
                <option value="Standard Plan">Standard Plan</option>
                <option value="Premium Plan">Premium Plan</option>
            </select>

        </div>

        <p id="message">Loading registrations...</p>

        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Plan</th>
                    <th>Price</th>
                    <th>Timing</th>
                    <th>Payment ID</th>
                    <th>Payment Status</th>
                    <th>Payment Date</th>
                </tr>
            </thead>

            <tbody id="registrationTable"></tbody>
        </table>

    </div>

    <script>

        const API_URL = "https://dance-fit-backend-cqmz.vercel.app";

        const token = localStorage.getItem("adminToken");

        function logout() {
            localStorage.removeItem("adminToken");
            window.location.href = "admin.html";
        }

        async function loadRegistrations() {

            if (!token) {
                window.location.href = "admin.html";
                return;
            }

            const message = document.getElementById("message");
            const table = document.getElementById("registrationTable");

            const refreshButton = document.querySelector(
                'button[onclick="loadRegistrations()"]'
            );

            try {

                message.textContent = "Loading registrations...";

                if (refreshButton) {
                    refreshButton.disabled = true;
                    refreshButton.textContent = "Refreshing...";
                }

                const response = await fetch(
                    `${API_URL}/api/admin/registrations?t=${Date.now()}`,
                    {
                        method: "GET",
                        cache: "no-store",
                        headers: {
                            "Authorization": `Bearer ${token}`,
                            "Cache-Control": "no-cache"
                        }
                    }
                );

                const data = await response.json();

                if (response.status === 401 || response.status === 403) {
                    logout();
                    return;
                }

                if (!response.ok || !data.success) {
                    throw new Error(
                        data.message || "Could not load registrations."
                    );
                }

                const registrations = data.registrations || [];

                document.getElementById("totalCount").textContent =
                    registrations.length;

                const totalRevenue = registrations.reduce(
                    (total, student) => {
                        if (
                            String(student[9] || "").trim().toLowerCase() === "paid"
                        ) {
                            return total + Number(student[6] || 0);
                        }

                        return total;
                    },
                    0
                );

                document.getElementById("totalRevenue").textContent =
                    "₹" + totalRevenue.toLocaleString("en-IN");

                table.innerHTML = "";

                if (registrations.length === 0) {
                    message.textContent = "No registrations found.";
                    return;
                }

                registrations.forEach(student => {

                    const row = document.createElement("tr");

                    const values = [
                        student[0],
                        student[1],
                        student[2],
                        student[3],
                        student[4],
                        student[5],
                        "₹" + (student[6] || 0),
                        student[7],
                        student[8] || "Not available",
                        student[9] || "Not available",
                        student[10] || "Not available"
                    ];

                    values.forEach((value, index) => {

                        const cell = document.createElement("td");

                        cell.textContent = value ?? "";

                        if (index === 9) {
                            const status = String(value).toLowerCase();

                            if (status === "paid") {
                                cell.classList.add("paid");
                            } else {
                                cell.classList.add("unpaid");
                            }
                        }

                        row.appendChild(cell);

                    });

                    table.appendChild(row);

                });

                filterStudents();

                message.textContent =
                    "Registrations updated successfully!";

            } catch (error) {

                message.textContent = error.message;

                console.error("Dashboard Error:", error);

            } finally {

                if (refreshButton) {
                    refreshButton.disabled = false;
                    refreshButton.textContent = "Refresh Data";
                }

            }
        }

        const searchInput = document.getElementById("searchInput");
        const courseFilter = document.getElementById("courseFilter");
        const planFilter = document.getElementById("planFilter");

        function filterStudents() {

            const searchValue = searchInput.value.toLowerCase();
            const selectedCourse = courseFilter.value.toLowerCase();
            const selectedPlan = planFilter.value.toLowerCase();

            const rows = document.querySelectorAll(
                "#registrationTable tr"
            );

            rows.forEach(row => {

                const name = row.cells[1].textContent.toLowerCase();
                const phone = row.cells[2].textContent.toLowerCase();
                const course = row.cells[4].textContent.toLowerCase();
                const plan = row.cells[5].textContent.toLowerCase();

                const matchesSearch =
                    name.includes(searchValue) ||
                    phone.includes(searchValue);

                const matchesCourse =
                    !selectedCourse || course === selectedCourse;

                const matchesPlan =
                    !selectedPlan || plan === selectedPlan;

                row.style.display =
                    matchesSearch && matchesCourse && matchesPlan
                        ? ""
                        : "none";

            });
        }

        searchInput.addEventListener("input", filterStudents);
        courseFilter.addEventListener("change", filterStudents);
        planFilter.addEventListener("change", filterStudents);

        loadRegistrations();

    </script>

</body>
</html>
